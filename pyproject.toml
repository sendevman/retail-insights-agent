[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-analyst"
version = "0.1.0"
description = "A scoped, auditable retail analysis CLI powered by Gemini and BigQuery"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
retail-chat = "retail_agent.cli:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["retail_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

